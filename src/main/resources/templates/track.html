<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track complaint</title><style>body{font:16px system-ui;background:#f4f7fb;margin:0;color:#182235}main{max-width:760px;margin:36px auto;padding:0 18px}.card{background:white;padding:24px;border-radius:12px;margin:16px 0}input{padding:11px;width:70%;max-width:400px}button{padding:11px;background:#1769aa;color:white;border:0;border-radius:6px}a{color:#1769aa}</style></head><body><main><p><a href="/">← Home</a> · <a href="/review">Reviewer desk</a></p><div class="card"><h1>Track complaint status</h1><form action="/track" method="get"><label for="reference">Complaint reference</label><br><input id="reference" name="reference" placeholder="CCP-123456" required><button type="submit">Track</button></form></div><div class="card" th:if="${param.reference}"><div th:if="${result}"><h2 th:text="${result.referenceId}"></h2><p><strong>Status:</strong> <span id="complaint-status" th:text="${result.status}"></span></p><p><strong>Subject:</strong> <span th:text="${result.subject}"></span></p><p><strong>Category:</strong> <span th:text="${result.category}"></span></p><p><strong>Submitted:</strong> <span th:text="${result.createdAt}"></span></p><p th:if="${result.reviewerNote}"><strong>Reviewer note:</strong> <span id="reviewer-note" th:text="${result.reviewerNote}"></span></p></div><p th:unless="${result}" id="not-found-message" role="alert">No complaint found for that reference.</p></div></main></body></html>
