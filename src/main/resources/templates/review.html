<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reviewer desk</title><style>body{font:15px system-ui;background:#f4f7fb;margin:0;color:#182235}main{max-width:1100px;margin:30px auto;padding:0 16px}.card{background:white;padding:20px;border-radius:12px;margin:16px 0;overflow-wrap:anywhere}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #ddd;padding:9px;vertical-align:top}input{padding:8px;width:140px}button{padding:8px 12px;border:0;border-radius:5px;color:white;background:#1769aa;cursor:pointer}.reject{background:#a11}.muted{color:#596579}</style></head><body><main><p><a href="/">← Submit complaint</a> · <a href="/track">Track status</a></p><div class="card"><h1>Reviewer desk</h1><p class="muted">Academic demo: this page is not access-controlled. Do not expose publicly.</p><p th:if="${complaints.isEmpty()}">No complaints submitted yet.</p><table th:unless="${complaints.isEmpty()}"><thead><tr><th>Reference / Consumer</th><th>Complaint</th><th>Status</th><th>Decision</th></tr></thead><tbody><tr th:each="c : ${complaints}"><td><strong th:text="${c.referenceId}"></strong><br><span th:text="${c.consumerName}"></span><br><span th:text="${c.email}"></span></td><td><strong th:text="${c.subject}"></strong><br><span th:text="${c.category}"></span><p th:text="${c.description}"></p></td><td th:text="${c.status}"></td><td><form th:action="@{/review/{id}/APPROVED(id=${c.id})}" method="post"><input name="note" placeholder="Reviewer note" aria-label="Approval note"><button type="submit" th:disabled="${c.status != 'SUBMITTED'}">Approve</button></form><form th:action="@{/review/{id}/REJECTED(id=${c.id})}" method="post"><input name="note" placeholder="Reason" aria-label="Rejection reason"><button class="reject" type="submit" th:disabled="${c.status != 'SUBMITTED'}">Reject</button></form></td></tr></tbody></table></div></main></body></html>
