name: Java CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: browser-actions/setup-chrome@v1
      - name: Build package
        run: mvn -B -DskipTests clean package
      - name: Start application
        run: |
          java -jar target/consumer-complaint-portal-1.0.0.jar > app.log 2>&1 &
          echo $! > app.pid
          for i in $(seq 1 30); do curl --fail --silent http://localhost:8080/ >/dev/null && exit 0; sleep 2; done
          cat app.log
          exit 1
      - name: Selenium tests
        run: mvn -B -Dheadless=true -DbaseUrl=http://localhost:8080 test
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
      - name: Stop application
        if: always()
        run: if [ -f app.pid ]; then kill "$(cat app.pid)" || true; fi
